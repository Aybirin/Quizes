<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media & Digital Communication Platforms Exam Prep</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --option-bg: #21262d;
            --option-hover: #30363d;
            --correct-bg: rgba(46, 160, 67, 0.15);
            --correct-border: #2ea043;
            --correct-text: #3fb950;
            --wrong-bg: rgba(248, 81, 73, 0.15);
            --wrong-border: #f85149;
            --wrong-text: #ff7b72;
            --analysis-bg: #1c2128;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 25px;
            z-index: 100;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
        }

        .stats-bar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .stat-box {
            font-size: 0.9rem;
            font-weight: 600;
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #30363d;
        }

        .score-box {
            color: var(--correct-text);
        }

        .answered-box {
            color: #58a6ff;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #30363d;
        }

        .question-text {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            background-color: var(--option-bg);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background-color 0.2s;
            border: 1px solid transparent;
            user-select: none;
        }

        .option:not(.disabled):hover {
            background-color: var(--option-hover);
        }

        .option.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--text-main);
        }

        .option.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--text-main);
        }

        .option.disabled {
            cursor: default;
        }

        .status-tag {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 4px;
            display: block;
        }

        .status-tag.correct-tag { color: var(--correct-text); }
        .status-tag.wrong-tag { color: var(--wrong-text); }

        .analysis-box {
            margin-top: 15px;
            background-color: var(--analysis-bg);
            border-radius: 8px;
            padding: 14px;
            border-left: 3px solid #58a6ff;
            display: none;
        }

        .analysis-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #58a6ff;
            margin-bottom: 6px;
        }

        .analysis-text {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="title">Social Media & Digital Communication Master Quiz</h1>
        <div class="stats-bar">
            <div class="stat-box score-box">Score: <span id="score-counter">0</span> / <span class="total-count">23</span></div>
            <div class="stat-box answered-box">Answered: <span id="answered-counter">0</span> / <span class="total-count">23</span></div>
        </div>
    </div>

    <div id="quiz-container"></div>
</div>

<script>

            ],
            correctIndex: 0,

        },
        {
            question: "How does social media assist individuals in staying informed on a broader scale?",
            options: [

        {

            options: [

            options: [

        // Section 2: Digital Communication Tools and Platforms
        {
            question: "What defines digital communication as a broader technological concept?",
            options: [

            options: [

                "Social media usage declined as organizations shifted exclusively to phone landlines.",

        },
        {
            question: "Which cluster of benefits best explains why digital communication is essential in modern settings?",
            options: [
                "Better worker engagement, comfortable experience, universal acceptability, organizational transparency, and savings in time, energy, and money.",
                "Complete elimination of operational costs, absolute privacy, and total automation of labor.",

            ],
            correctIndex: 0,
            analysis: "Digital communication is crucial because it drives worker engagement, convenient usability, widespread adoption, internal transparency, and resource efficiency."
        },
        {
            question: "What primary function do instant messaging platforms like WhatsApp, Facebook Messenger, and Slack serve?",
            options: [

            ],
            correctIndex: 0,
            analysis: "Instant messaging platforms focus on real-time, low-friction text and media exchanges that maximize speed and operational efficiency for personal and team use."
        },
        {
            question: "How have video conferencing tools such as Google Meet, Zoom, and Microsoft Teams transformed remote interactions?",
            options: [
                "By enabling face-to-face interactions and virtual meetings that redefine remote communication.",
                "By replacing written documentation with automated voice-to-text summaries.",
                "By eliminating the need for scheduled business meetings entirely.",
                "By serving exclusively as platforms for streaming large-scale public entertainment."
            ],
            correctIndex: 0,
            analysis: "Video tools bridged geographical barriers by replicating in-person dynamics through face-to-face virtual meetings."
        },
        {
            question: "What is the primary role of general social media platforms like Facebook, Twitter, Instagram, and LinkedIn?",
            options: [
                "Connecting people globally while enabling life updates, public discussions, and network building.",
                "Storing high-security enterprise databases in decentralized clouds.",
                "Managing internal supply chain logistics for international shipping.",
                "Providing private, end-to-end encrypted financial transactions."
            ],
            correctIndex: 0,
            analysis: "These social networking channels connect global users, offering avenues for personal status sharing, broader community dialogue, and relationship networking."
        },
        {
            question: "Despite newer communication technologies, email remains critical because it is:",
            options: [
                "A widely used, formal, and reliable digital communication method for exchanging messages and official files.",
                "The fastest medium for real-time informal group chat conversations.",
                "An anonymous file-sharing system designed to bypass corporate firewalls.",
                "A system that automatically categorizes all incoming data into legal briefs."
            ],
            correctIndex: 0,
            analysis: "Email maintains its position as the baseline formal standard for structured, reliable, and documentation-friendly digital correspondence."
        },
        {
            question: "What is the key advantage offered by collaborative tools and cloud storage platforms like Google Drive and Dropbox?",
            options: [
                "Allowing users to collaborate on documents in real-time, significantly boosting teamwork and productivity.",
                "Automatically generating written content based on simple user prompts.",
                "Replacing the need for local hardware operating systems.",
                "Encrypting files so that only a single user can access them at any given time."
            ],
            correctIndex: 0,
            analysis: "Cloud storage and collaboration systems excel at enabling simultaneous multi-user document editing and file management, enhancing team workflows."
        },
        {
            question: "How can businesses specifically leverage professional social networking platforms like Twitter and LinkedIn?",
            options: [
                "For professional networking, knowledge sharing, and industry engagement to build a loyal customer base.",
                "To conduct internal employee payroll and tax processing.",

            ],
            correctIndex: 0,
            analysis: "LinkedIn and Twitter offer strategic value to businesses by facilitating industry influence, expert content distribution, and targeted customer network growth."
        },
        {
            question: "What primary utility do mobile applications offer within the digital communication ecosystem?",
            options: [
                "Enabling communication on the go by providing instant access to messaging, social media, banking, and other services.",
                "Increasing physical device processing power through network tethering.",
                "Standardizing user interfaces across different hardware manufacturers.",
                "Eliminating the requirement for wireless internet or cellular data connections."
            ],
            correctIndex: 0,
            analysis: "Mobile apps deliver portability, allowing continuous access to vital communication, transaction, and social channels regardless of location."
        },
        {
            question: "How do project management software, virtual whiteboards, live chats, and chatbots support modern operations?",
            options: [
                "Project management tools and whiteboards facilitate remote team collaboration, while live chat and chatbots provide prompt customer support.",
                "They fully automate human customer service roles without requiring supervision.",
                "They replace traditional email systems by converting all communication into project tasks.",
                "They restrict client interactions exclusively to pre-recorded video responses."
            ],
            correctIndex: 0,
            analysis: "Project management tools and whiteboards streamline internal remote workflows, whereas live chat and automated chatbots address external customer service responsiveness."
        }
    ];

    const TOTAL = keyData.length;
    let score = 0;
    let answered = 0;

    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function init() {
        document.querySelectorAll('.total-count').forEach(el => el.textContent = TOTAL);
        const container = document.getElementById('quiz-container');
        const shuffledQuestions = shuffle(keyData);

        shuffledQuestions.forEach((q, idx) => {
            let options = q.options.map((opt, i) => ({ text: opt, correct: i === q.correctIndex }));
            options = shuffle(options);

            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${idx}`;

            const labels = ['A', 'B', 'C', 'D'];
            let optsHTML = '';
            options.forEach((opt, cIdx) => {
                optsHTML += `<div class="option" data-correct="${opt.correct}" onclick="check('q-${idx}', this)">${labels[cIdx]}. ${opt.text}</div>`;
            });

            card.innerHTML = `
                <div class="question-text">${idx + 1}. ${q.question}</div>
                <div class="options-list">${optsHTML}</div>
                <div class="analysis-box">
                    <div class="analysis-title">Explanation</div>
                    <p class="analysis-text">${q.analysis}</p>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function check(cardId, selectedOpt) {
        const card = document.getElementById(cardId);
        if (card.getAttribute('data-answered') === 'true') return;
        card.setAttribute('data-answered', 'true');

        const isCorrect = selectedOpt.getAttribute('data-correct') === 'true';
        const options = card.querySelectorAll('.option');

        options.forEach(opt => {
            opt.classList.add('disabled');
            const optCorrect = opt.getAttribute('data-correct') === 'true';
            if (opt === selectedOpt) {
                if (isCorrect) {
                    opt.classList.add('correct');
                    opt.innerHTML += ` <span class="status-tag correct-tag">✓ Correct answer</span>`;
                    score++;
                } else {
                    opt.classList.add('wrong');
                    opt.innerHTML += ` <span class="status-tag wrong-tag">✕ Your answer</span>`;
                }
            } else if (optCorrect) {
                opt.classList.add('correct');
                opt.innerHTML += ` <span class="status-tag correct-tag">✓ Correct answer</span>`;
            }
        });

        card.querySelector('.analysis-box').style.display = 'block';
        answered++;
        document.getElementById('score-counter').textContent = score;
        document.getElementById('answered-counter').textContent = answered;
    }

    window.onload = init;
</script>
</body>
</html>
