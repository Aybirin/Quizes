    const TOTAL_QUESTIONS = quizData.length; 
    let currentScore = 0;
    let answeredCount = 0;

    // Fisher-Yates shuffle algorithm
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function initQuiz() {
        document.querySelectorAll('.total-count').forEach(el => el.textContent = TOTAL_QUESTIONS);
        const quizContainer = document.getElementById('quiz-container');

        // 1. Randomize items order
        const randomizedQuestions = shuffleArray(quizData);

        randomizedQuestions.forEach((qData, qIndex) => {
            // 2. Map original choices to preserve tracking of correct answer
            let formattedChoices = qData.options.map((optText, origIndex) => ({
                text: optText,
                isCorrect: origIndex === qData.correctIndex
            }));

            // 3. Randomize choices order
            formattedChoices = shuffleArray(formattedChoices);

            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            qCard.id = `q-${qIndex}`;

            const labels = ['A', 'B', 'C', 'D'];
            let optionsHTML = '';

            formattedChoices.forEach((choice, cIndex) => {
                optionsHTML += `
                    <div class="option" data-correct="${choice.isCorrect}" onclick="checkAnswer('q-${qIndex}', this)">
                        ${labels[cIndex]}. ${choice.text}
                    </div>
                `;
            });

            qCard.innerHTML = `
                <div class="question-text">${qIndex + 1}. ${qData.question}</div>
                <div class="options-list">${optionsHTML}</div>
                <div class="analysis-box">
                    <div class="analysis-title">AI Analysis</div>
                    <p class="analysis-text">${qData.analysis}</p>
                </div>
            `;

            quizContainer.appendChild(qCard);
        });
    }

    function checkAnswer(questionCardId, selectedOption) {
        const card = document.getElementById(questionCardId);
        if (card.getAttribute('data-answered') === 'true') return;
        card.setAttribute('data-answered', 'true');

        const options = card.querySelectorAll('.option');
        const analysisBox = card.querySelector('.analysis-box');
        const isSelectedCorrect = selectedOption.getAttribute('data-correct') === 'true';

        options.forEach((opt) => {
            opt.classList.add('disabled');
            const isOptCorrect = opt.getAttribute('data-correct') === 'true';

            if (opt === selectedOption) {
                if (isSelectedCorrect) {
                    opt.classList.add('correct');
                    opt.innerHTML += ` <span class="status-tag correct-tag">✓ Correct answer (Your answer)</span>`;
                    currentScore++;
                } else {
                    opt.classList.add('wrong');
                    opt.innerHTML += ` <span class="status-tag wrong-tag">✕ Your answer</span>`;
                }
            } else if (isOptCorrect) {
                opt.classList.add('correct');
                opt.innerHTML += ` <span class="status-tag correct-tag">✓ Correct answer</span>`;
            }
        });

        if (analysisBox) {
            analysisBox.style.display = 'block';
        }

        answeredCount++;
        document.getElementById('score-counter').textContent = currentScore;
        document.getElementById('answered-counter').textContent = answeredCount;
    }

    window.onload = initQuiz;
