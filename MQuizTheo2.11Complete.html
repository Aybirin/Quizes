    const TOTAL = keyData.length;
    let score = 0;
    let answered = 0;

    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function init() {
        document.querySelectorAll('.total-count').forEach(el => el.textContent = TOTAL);
        const container = document.getElementById('quiz-container');
        const shuffledQuestions = shuffle(keyData);

        shuffledQuestions.forEach((q, idx) => {
            let options = q.options.map((opt, i) => ({ text: opt, correct: i === q.correctIndex }));
            options = shuffle(options);

            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${idx}`;

            const labels = ['A', 'B', 'C', 'D'];
            let optsHTML = '';
            options.forEach((opt, cIdx) => {
                optsHTML += `<div class="option" data-correct="${opt.correct}" onclick="check('q-${idx}', this)">${labels[cIdx]}. ${opt.text}</div>`;
            });

            card.innerHTML = `
                <div class="question-text">${idx + 1}. ${q.question}</div>
                <div class="options-list">${optsHTML}</div>
                <div class="analysis-box">
                    <div class="analysis-title">Explanation</div>
                    <p class="analysis-text">${q.analysis}</p>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function check(cardId, selectedOpt) {
        const card = document.getElementById(cardId);
        if (card.getAttribute('data-answered') === 'true') return;
        card.setAttribute('data-answered', 'true');

        const isCorrect = selectedOpt.getAttribute('data-correct') === 'true';
        const options = card.querySelectorAll('.option');

        options.forEach(opt => {
            opt.classList.add('disabled');
            const optCorrect = opt.getAttribute('data-correct') === 'true';
            if (opt === selectedOpt) {
                if (isCorrect) {
                    opt.classList.add('correct');
                    opt.innerHTML += ` <span class="status-tag correct-tag">✓ Correct answer</span>`;
                    score++;
                } else {
                    opt.classList.add('wrong');
                    opt.innerHTML += ` <span class="status-tag wrong-tag">✕ Your answer</span>`;
                }
            } else if (optCorrect) {
                opt.classList.add('correct');
                opt.innerHTML += ` <span class="status-tag correct-tag">✓ Correct answer</span>`;
            }
        });

        card.querySelector('.analysis-box').style.display = 'block';
        answered++;
        document.getElementById('score-counter').textContent = score;
        document.getElementById('answered-counter').textContent = answered;
    }

    window.onload = init;
